# Config for Dependabot updates. See Documentation here:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Update GitHub actions in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies — managed by uv (pyproject.toml + uv.lock).
  # requirements/*.txt are generated artifacts; do not watch them with pip.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker base images. Dependabot can't recurse, so one entry per Dockerfile.
  - package-ecosystem: "docker"
    directory: "compose/local/"
    schedule:
      interval: "weekly"
    # Ignore major/minor Python image bumps; patch updates only
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker"
    directory: "compose/production/django/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker"
    directory: "compose/production/postgres/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "compose/production/nginx/"
    schedule:
      interval: "weekly"
