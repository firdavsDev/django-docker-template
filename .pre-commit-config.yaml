exclude: '(\.eggs|\.git|\.hg|\.mypy_cache|\.pytest_cache|\.tox|\.venv|venv|.env|env|\.vscode|static|media/|deployments|scripts|requirements|.*/templates|.*/migrations)'
repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.11.13
      hooks:
          # Lint + autofix: unused imports/variables (replaces autoflake),
          # import sorting (replaces isort), flake8-style checks
          - id: ruff
            args: ["--fix"]
          # Formatter (replaces black)
          - id: ruff-format
