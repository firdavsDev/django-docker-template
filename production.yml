volumes:
  static_volume: {}
  media_volume: {}
  certs: {}
  production_postgres_data: {}
  production_postgres_data_backups: {}

# Cap container stdout logs: 5MB x 5 files per service
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "5"

services:
  django:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: name_django
    restart: always
    container_name: django
    logging: *default-logging
    depends_on:
      - postgres
    volumes:
      # NOTE: no source bind mount in production — code is baked into the image.
      # Entrypoint chowns ./logs to the django user automatically.
      - ./logs:/home/app/web/logs
      - static_volume:/home/app/web/src/static
      - media_volume:/home/app/web/src/media
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    ports:
      # bound to localhost only: Docker published ports bypass UFW,
      # so 8000:8000 would be reachable from the internet
      - "127.0.0.1:8000:8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: name_postgres
    restart: always
    container_name: postgres
    logging: *default-logging
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: name_nginx
    restart: always
    container_name: nginx
    logging: *default-logging
    volumes:
      - static_volume:/home/app/web/src/static
      - media_volume:/home/app/web/src/media
      - certs:/etc/nginx/ssl
      # persist + rotate nginx logs on the host (compose json-file rotation
      # only covers container stdout, not these files)
      - ./logs/nginx:/home/app/logs
    ports:
      - 80:80
      - 443:443
    depends_on:
      - django

  redis:
    image: redis:7-alpine
    restart: always
    container_name: name_redis
    logging: *default-logging
    # No public port: reachable from other services via the compose network only

  celery:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    command: celery -A config worker -l info
    container_name: name_celery
    restart: always
    logging: *default-logging
    volumes:
      - ./logs:/home/app/web/logs
      - media_volume:/home/app/web/src/media
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    depends_on:
      - postgres
      - redis

  celery-beat:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    command: celery -A config beat -l info
    container_name: name_celery_beat
    restart: always
    logging: *default-logging
    volumes:
      - ./logs:/home/app/web/logs
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    depends_on:
      - redis
      - postgres
